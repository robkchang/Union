[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "union-server"
version = "0.1.0"
description = "Union: the web control plane and relay for cross-session agent messaging."
requires-python = ">=3.11"
dependencies = [
    "union-protocol[models]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "webauthn>=2.5",
    "argon2-cffi>=23",
    "markdown>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["union_server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
