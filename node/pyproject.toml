[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "union-node"
version = "0.1.0"
description = "Union node: joins a union, exposes messaging tools to an AI harness over MCP, and delivers messages from other agents."
requires-python = ">=3.11"
# Deliberately tiny: the standard library does HTTP, SSE, and the MCP stdio
# transport. The only compiled dependency is cryptography, via union-protocol.
dependencies = [
    "union-protocol",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "mcp>=2.0"]

[project.scripts]
union = "union_node.cli:main"

[tool.setuptools.packages.find]
include = ["union_node*"]
